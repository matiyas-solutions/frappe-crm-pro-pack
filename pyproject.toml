# Metadata for bench and linters. The package itself is built from setup.py.

[tool.bench.frappe-dependencies]
# Targets Frappe v16 with Frappe CRM 1.x. Queries use the dict syntax for SQL functions
# (e.g. {"COUNT": "name", "as": "n"}), which v16's query engine requires. Not re-tested on v15.
frappe = ">=15.0.0,<18.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
indent-style = "tab"
